<nav>

  <a
    routerLink="/cataleg"
    routerLinkActive="active"
  >
    Catàleg
  </a>

  <a
    routerLink="/cerca"
    routerLinkActive="active"
  >
    Cerca
  </a>

  <a
    routerLink="/preferits"
    routerLinkActive="active"
  >
    Preferits
  </a>

  @if((usuari$ | async) === null){

    <a
      routerLink="/login"
      routerLinkActive="active"
    >
      Iniciar sessió
    </a>

  }

  @if((usuari$ | async) !== null){

    <span>
      Usuari:
      {{ (usuari$ | async)?.nom }}
    </span>

    <button (click)="logout()">
      Tancar sessió
    </button>

  }

</nav>
