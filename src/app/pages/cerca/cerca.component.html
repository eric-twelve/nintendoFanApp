<h1>Cerca de videojocs</h1>

<input
  type="text"
  [(ngModel)]="textCerca"
  placeholder="Buscar videojoc"
>

<ul>

  @for(videojoc of videojocs; track videojoc.id){

    @if(
      videojoc.nom
        .toLowerCase()
        .includes(textCerca.toLowerCase())
    ){

      <li>

        {{ videojoc.nom }}

      </li>

    }

  }

</ul>
