<h2>Iniciar sessió</h2>
<form (ngSubmit)="iniciarSessio()">
  <input
    type="email"
    placeholder="Email"
    [(ngModel)]="email"
    name="email"
  >
  <input
    type="password"
    placeholder="Contrasenya"
    [(ngModel)]="contrasenya"
    name="contrasenya"
  >
  <button type="submit">
    Entrar
  </button>
</form>

@if(error){
  <p class="error">
    Credencials incorrectes
  </p>
}
